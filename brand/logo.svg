<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="satchel: one passkey fanning out to namespace keys">
  <rect width="1024" height="1024" fill="#ffffff"/>
  <!-- the key rail: one passkey (filled circle) fans out to three namespace chips, each labelled with its fingerprint; the middle namespace carries a grant (accent line) to an app (open circle) -->
  <g transform="translate(-64 0)">
    <g fill="none" stroke="#0a0a0a" stroke-width="14" stroke-linecap="round">
      <path d="M 314 400 C 450 400, 480 226, 640 226"/>
      <path d="M 314 400 L 640 400"/>
      <path d="M 314 400 C 450 400, 480 574, 640 574"/>
    </g>
    <circle cx="250" cy="400" r="64" fill="#0a0a0a"/>
    <g fill="#0a0a0a">
      <rect x="640" y="198" width="150" height="56" rx="14"/>
      <rect x="640" y="372" width="150" height="56" rx="14"/>
      <rect x="640" y="546" width="150" height="56" rx="14"/>
    </g>
    <g fill="#ffffff">
      <rect x="658" y="222" width="64" height="8" rx="4"/>
      <rect x="658" y="396" width="92" height="8" rx="4"/>
      <rect x="658" y="570" width="48" height="8" rx="4"/>
    </g>
    <path d="M 790 400 L 898 400" stroke="#00d4a4" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="936" cy="400" r="30" fill="#ffffff" stroke="#0a0a0a" stroke-width="12"/>
  </g>
  <text x="512" y="862" text-anchor="middle" font-family="Inter" font-weight="600" font-size="176" letter-spacing="-5" fill="#0a0a0a">satchel</text>
</svg>
