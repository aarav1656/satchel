<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:var(--canvas);background-image:linear-gradient(oklch(100% 0 0/.035) 1px,transparent 1px),linear-gradient(90deg,oklch(100% 0 0/.035) 1px,transparent 1px);background-size:64px 64px}
#fr{position:absolute;overflow:hidden;border-radius:14px;border:1px solid var(--hair);box-shadow:0 30px 80px oklch(0% 0 0/.5)}
#fr img{position:absolute;left:0;top:0;transform-origin:0 0}
.hi{position:absolute;border:4px solid oklch(85% .16 165);border-radius:8px;background:oklch(85% .16 165/.16);opacity:0}
#lab{position:absolute;left:0;right:0;top:790px;text-align:center;font:500 24px "GMono";color:var(--steel);opacity:0}
</style>
<div id="fr"><img id="im"></div><div id="lab"></div>
<script src="engine.js"></script><script>
const IW=cue("w",2200),IH=cue("h",1520),[cx,cy,W,H]=cue("crop",[0,0,IW,IH]),maxH=cue("maxH",860),maxW=cue("maxW",1500);
const s=Math.min(maxH/H,maxW/W),fw=W*s,fh=H*s,fx=(1920-fw)/2,fy=cue("top",60);
const fr=$("#fr");fr.style.cssText+=`left:${fx}px;top:${fy}px;width:${fw}px;height:${fh}px`;
const im=$("#im");im.src=cue("img");im.style.width=IW*s+"px";im.style.height=IH*s+"px";im.style.left=-cx*s+"px";im.style.top=-cy*s+"px";
const his=cue("hi",[]).map(([x,y,w,h,t0,t1])=>{const d=document.createElement("div");d.className="hi";d.style.cssText+=`left:${(x-cx)*s-6}px;top:${(y-cy)*s-4}px;width:${w*s+12}px;height:${h*s+8}px`;fr.append(d);return {d,t0,t1}});
$("#lab").textContent=cue("label","");
window.render=(t)=>{fr.style.opacity=eo(seg(t,0,.4));fr.style.transform=`scale(${1+.03*seg(t,0,cue("dur",8))})`;
 his.forEach(({d,t0,t1})=>{d.style.opacity=t1!==undefined?Math.min(eo(seg(t,t0,t0+.3)),1-eo(seg(t,t1,t1+.3))):eo(seg(t,t0,t0+.3))});
 $("#lab").style.opacity=eo(seg(t,.4,.8))};
</script>
