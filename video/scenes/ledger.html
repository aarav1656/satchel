<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:var(--canvas);background-image:linear-gradient(oklch(100% 0 0/.035) 1px,transparent 1px),linear-gradient(90deg,oklch(100% 0 0/.035) 1px,transparent 1px);background-size:64px 64px}
.c{position:absolute;top:130px;width:780px;height:560px;border:1px solid var(--hair);border-radius:18px;background:var(--surface);padding:40px 44px;box-shadow:inset 0 1px 0 oklch(100% 0 0/.07);opacity:0}
#g{left:150px}#r{left:990px}
.k{font:600 30px "Bricolage";color:var(--steel);letter-spacing:-.01em}.n{margin-top:20px;font:600 120px/1 "Bricolage";letter-spacing:-.04em;color:var(--ink)}.n small{font:600 44px "Bricolage";color:var(--steel);letter-spacing:-.02em;margin-left:14px}
.d{margin-top:26px;font:500 23px/1.7 "GMono";color:var(--steel)}.d b{color:var(--accent);font-weight:600}
#v{position:absolute;left:150px;top:740px;width:1620px;padding:22px 32px;border:1px solid var(--hair);border-radius:14px;background:var(--code);font:500 25px/1.5 "GMono";color:var(--text);opacity:0}
#v b{color:var(--accent);font-weight:600}#v i{font-style:normal;color:var(--steel)}
</style>
<div class="c" id="g"></div>
<div class="c" id="r"></div>
<div id="v"></div>
<script src="engine.js"></script><script>
const R=cue("run");$("#g").innerHTML=`<div class="k">Allow Fern</div><div class="n">${R.gsec}<small>seconds</small></div><div class="d">public record on Monad<br>block <b>${R.gblock}</b><br>confirmed</div>`;
$("#r").innerHTML=`<div class="k">Revoke Fern</div><div class="n">${R.rsec}<small>seconds</small></div><div class="d">public record on Monad<br>block <b>${R.rblock}</b><br>confirmed, every memory locked again</div>`;
$("#v").innerHTML=`<i>anyone can read it back:</i> Fern's permission is <b>cancelled</b> &nbsp;&middot;&nbsp; the lock is on version <b>2</b>`;
window.render=(t)=>{$("#g").style.opacity=eo(seg(t,.2,.6));$("#r").style.opacity=eo(seg(t,1.4,1.8));$("#v").style.opacity=eo(seg(t,2.8,3.2))};
</script>
